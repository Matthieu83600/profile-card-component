<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- displays site properly based on user's device -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main class="container">
      <article class="card">
        <div class="card__profile">
          <img src="./images/image-victor.jpg" alt="Victor's profile" />
        </div>
        <div class="card__content">
          <h1 class="card__content-title">Victor Crest <span>26</span></h1>
          <p class="card__content-location">London</p>
          <div class="card__demarcation"></div>
          <div class="card__content-stats">
            <div class="card__content-stats-item">
              <span class="card__content-stats-item-number">80K</span>
              <span class="card__content-stats-item-name">Followers</span>
            </div>
            <div class="card__content-stats-item">
              <span class="card__content-stats-item-number">803K</span>
              <span class="card__content-stats-item-name">Likes</span>
            </div>
            <div class="card__content-stats-item">
              <span class="card__content-stats-item-number">1.4K</span>
              <span class="card__content-stats-item-name">Photos</span>
            </div>
          </div>
        </div>
      </article>
    </main>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by
      <a href="https://matthieubonjour.dev" target="_blank">Matthieu Bonjour</a>.
    </footer>
  </body>
</html>
